CONFIG_GPIO=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# CONFIG_LOG_MODE
CONFIG_SUM_PRINT=y

# Sensor framework and I2C controller
CONFIG_SENSOR=y
CONFIG_I2C=y

# TF-M uses UART1 during secure boot, then releases the shared
# Serial1 peripheral so the non-secure application can use TWIM1.
CONFIG_TFM_SECURE_UART_SHARE_INSTANCE=y